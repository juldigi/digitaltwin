<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8eef2">
<meta name="description" content="Tampilan ringkas 3D pabrik BMJ untuk beranda Superadmin OMODOS.">
<title>BMJ · Factory Overview</title>
<script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/addons/"}}</script>
<style>
:root{color-scheme:light;font-family:Inter,"Segoe UI",system-ui,sans-serif;background:#e8eef2;color:#102433}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;min-height:100%;overflow:hidden;background:#e8eef2}
#viewport{position:fixed;inset:0;width:100vw;height:100dvh;overflow:hidden;background:#e8eef2}
#viewport canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
#machine-status-layer{position:fixed;inset:0;z-index:5;overflow:hidden;pointer-events:none}
#machine-status-leaders{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.machine-status-card{position:absolute;left:-9999px;top:-9999px;display:flex;align-items:center;gap:6px;width:clamp(94px,9vw,124px);min-height:34px;padding:5px 7px;border:1px solid rgba(27,57,76,.19);border-radius:8px;background:rgba(255,255,255,.94);box-shadow:0 2px 8px rgba(16,36,51,.13);color:#102433;transform:none;opacity:1;transition:opacity .12s linear;white-space:normal}
.machine-status-card .status-dot{flex:0 0 7px;width:7px;height:7px;border-radius:50%;background:#7c8992;box-shadow:0 0 0 2px rgba(124,137,146,.16)}
.machine-status-card .status-copy{min-width:0;display:flex;flex-direction:column;gap:2px;line-height:1.1}
.machine-status-card .status-name{font-size:10px;font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.machine-status-card .status-code{font-size:8px;color:#637786;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.machine-status-card .status-state{margin-left:auto;flex:0 0 auto;font-size:8px;font-weight:800;line-height:1.1;max-width:53px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.machine-status-card.status-kritikal{border-color:rgba(183,44,44,.45);background:rgba(255,246,246,.97)}
.machine-status-card.status-kritikal .status-dot{background:#d22f3f;box-shadow:0 0 0 2px rgba(210,47,63,.15)}
.machine-status-card.status-kritikal .status-state{color:#ad1d2c}
.machine-status-card.status-perhatian{border-color:rgba(178,111,13,.44);background:rgba(255,250,238,.97)}
.machine-status-card.status-perhatian .status-dot{background:#d68b16;box-shadow:0 0 0 2px rgba(214,139,22,.16)}
.machine-status-card.status-perhatian .status-state{color:#8b5500}
.machine-status-card.status-normal{border-color:rgba(27,125,91,.33)}
.machine-status-card.status-normal .status-dot{background:#19845f;box-shadow:0 0 0 2px rgba(25,132,95,.15)}
.machine-status-card.status-normal .status-state{color:#146548}
.machine-status-card.status-none .status-dot{background:#8796a0}
.machine-status-card.status-unlinked{border-style:dashed;background:rgba(246,248,249,.92)}
.machine-status-card.status-unlinked .status-state{color:#62727c}
.machine-status-card.compact{width:66px;min-height:21px;height:21px;padding:3px 5px;gap:4px;border-radius:6px;box-shadow:0 1px 5px rgba(16,36,51,.12)}
.machine-status-card.compact .status-name{font-size:8px}
.machine-status-card.compact .status-code{display:none}
.machine-status-card.compact .status-state{font-size:7px;max-width:27px}
.machine-status-card.compact .status-dot{flex-basis:6px;width:6px;height:6px}
#lite-topline{position:fixed;z-index:8;left:max(10px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));display:flex;align-items:center;gap:8px;max-width:calc(100vw - 20px);padding:7px 10px;border:1px solid rgba(255,255,255,.7);border-radius:9px;background:rgba(248,251,253,.88);color:#19384b;box-shadow:0 2px 10px rgba(15,35,49,.08);backdrop-filter:blur(8px);pointer-events:none}
#lite-topline strong{font-size:10px;letter-spacing:.02em}
#lite-topline span{font-size:9px;color:#526b7a;max-width:min(52vw,460px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#lite-loading{position:fixed;z-index:20;inset:0;display:grid;place-content:center;gap:7px;text-align:center;padding:24px;background:#e8eef2;color:#1c3b4e;font-size:13px}
#lite-loading strong{font-size:15px}
#lite-loading small{font-size:11px;color:#657987}
#lite-loading[hidden]{display:none}
@media(max-width:600px){
 #lite-topline{top:max(8px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));padding:6px 8px;gap:6px}
 #lite-topline strong{font-size:9px}
 #lite-topline span{font-size:8px;max-width:48vw}
 .machine-status-card{width:96px;min-height:30px;padding:4px 5px;gap:4px;border-radius:7px}
 .machine-status-card .status-name{font-size:9px}
 .machine-status-card .status-code{font-size:7px}
 .machine-status-card .status-state{font-size:7px;max-width:39px}
 .machine-status-card.compact{width:60px;height:20px;min-height:20px;padding:3px 4px}
}
@media(prefers-reduced-motion:reduce){.machine-status-card{transition:none}}
</style>
</head>
<body>
<div id="viewport" aria-label="Tampilan 3D seluruh mesin pabrik BMJ"></div>
<div id="machine-status-layer" aria-label="Status mesin pada tampilan pabrik 3D"><svg id="machine-status-leaders" xmlns="http://www.w3.org/2000/svg"></svg></div>
<div id="lite-topline"><strong>BMJ · FACTORY OVERVIEW</strong><span id="lite-sync-state">Menyiapkan layout 3D…</span></div>
<div id="lite-loading" role="status"><strong>Menyiapkan tampilan 3D</strong><small>Mengambil data layout dan model mesin dari DigitalTwin.</small></div>
<script type="module" src="./src/omodos-lite.js"></script>
</body>
</html>
