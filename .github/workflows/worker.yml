name: Deploy Cloudflare Workers
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-workers
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Run Cloudflare release gate
        run: npm run test:release
      - name: Validate Cloudflare credentials
        run: node scripts/check-deploy.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: d4d5e00abe628f14b21f2d55e957a354
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Connect or create Digital Twin D1
        id: prepare_d1
        continue-on-error: true
        run: node scripts/prepare-d1.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: d4d5e00abe628f14b21f2d55e957a354
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      - name: Apply D1 migrations
        if: steps.prepare_d1.outcome == 'success'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: d4d5e00abe628f14b21f2d55e957a354
          workingDirectory: backend
          command: d1 migrations apply DB --remote
      - name: Deploy current application to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: d4d5e00abe628f14b21f2d55e957a354
          workingDirectory: backend
          command: deploy
      - name: Report D1 permission failure
        if: steps.prepare_d1.outcome == 'failure'
        run: |
          echo 'Worker terdeploy untuk perbaikan UI, tetapi D1 belum terhubung. Berikan D1 Read dan D1 Write pada CLOUDFLARE_API_TOKEN di GitHub Secrets.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
